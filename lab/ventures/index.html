<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monoliths lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #050404; color: #E8E4D8; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 8px; bottom: 8px; opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// Lab host for lib/world/glsl/monolith.glsl: a stand-in sky and smooth lava sea so the metal can be judged on its own.
// URL: ?view=desk|phone|close|low  ?rise=0..1 (all) or rise0/rise1/rise2  ?heat=0..1 (hot one: hov=i)  ?t=seconds
//      ?sun=back|side|front  ?q=render scale
const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
const mono = await (await fetch('../../lib/world/glsl/monolith.glsl')).text();

const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const fs = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes; uniform vec3 uCamP; uniform mat3 uCamM; uniform float uFov; uniform float uGrainT;
${mono}

float seaH(vec2 x, float t){
  // a long, slow swell: viscous, smooth (lab stand-in for the lava module)
  float h = 0.0;
  h += 0.10 * sin(dot(x, vec2(0.13, 0.05)) - t * 0.55);
  h += 0.06 * sin(dot(x, vec2(-0.07, 0.19)) - t * 0.71 + 1.3);
  h += 0.03 * sin(dot(x, vec2(0.31, 0.22)) - t * 1.05 + 2.1);
  h += 0.015 * sin(dot(x, vec2(-0.45, 0.38)) - t * 1.3 + 0.4);
  h += 0.006 * sin(dot(x, vec2(1.3, 0.9)) - t * 2.1 + 1.0) + 0.004 * sin(dot(x, vec2(-1.1, 1.7)) - t * 2.6);
  return h;
}
vec3 seaN(vec2 x, float t, float fw){
  float e = max(0.05, fw);
  float hx = seaH(x + vec2(e, 0.0), t) - seaH(x - vec2(e, 0.0), t);
  float hz = seaH(x + vec2(0.0, e), t) - seaH(x - vec2(0.0, e), t);
  return normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 stars(vec3 d){
  if (d.y < 0.0) return vec3(0.0);
  vec2 uv = vec2(atan(d.x, -d.z), asin(d.y)) * 260.0;
  vec2 c = floor(uv); vec2 f = fract(uv) - 0.5;
  float h = hash12(c);
  float s = step(0.985, h) * smoothstep(0.5, 0.0, length(f)) * pow(fract(h * 91.7), 6.0);
  return vec3(0.75, 0.85, 1.0) * s * 0.6 * smoothstep(0.03, 0.25, d.y);
}
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 sp = (fc - 0.5 * uRes) / uRes.y;
  float pixAng = uFov / uRes.y;
  vec3 rd = normalize(uCamM * vec3(sp * uFov, -1.0));
  vec3 ro = uCamP;
  vec3 up = vec3(0.0, 1.0, 0.0);
  float tSea = rd.y < 0.0 ? -ro.y / rd.y : 1e5;
  MonoHit mh;
  bool hit = monoTrace(ro, rd, tSea, mh);
  vec3 col;
  if (hit) {
    col = monoShade(mh, rd, pixAng);
    // stand-in atmospheric perspective (the world applies its own): far things lift toward the dusk and cool
    float fogk = 1.0 - exp(-mh.t * 0.004);
    col = mix(col, monoSky(normalize(vec3(rd.x, 0.02, rd.z)), up, 0.3) * 0.6, fogk);
  } else if (rd.y < 0.0) {
    vec3 p = ro + rd * tSea;
    float fw = tSea * pixAng;
    vec3 n = seaN(p.xz, uMonoT, fw);
    // unresolved swell becomes roughness (keeps the far sea from shimmering)
    float rough = clamp(0.06 + fw * 0.25, 0.06, 0.6);
    vec3 v = -rd; float NoV = max(dot(n, v), 0.0);
    float F = 0.04 + 0.96 * pow(1.0 - NoV, 5.0);
    vec3 r = reflect(rd, n); r.y = abs(r.y);
    vec3 refl = monoSky(r, up, rough * rough) + stars(r) * (1.0 - smoothstep(0.0, 0.2, rough));
    MonoHit rh;
    if (monoTrace(p + n * 0.01, r, 1e4, rh)) refl = monoShade(rh, r, pixAng * 1.5);
    // smooth molten colour: a slow temperature field, never patches; hotter in the pools at the feet
    float Tn = 980.0 + 60.0 * sin(p.x * 0.05 + p.z * 0.03 + uMonoT * 0.05) + 40.0 * sin(p.z * 0.11 - p.x * 0.04);
    Tn += 380.0 * min(monoSeaGlow(p), 1.4);
    vec3 em = monoBB(Tn) * 14.0 * (1.0 - F);
    col = em + refl * F;
  } else {
    col = monoSky(rd, up, 0.0) + stars(rd);
  }
  // exposure, filmic curve, grain
  col *= 1.0;
  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash12(fc + uGrainT * 61.0) - 0.5) * 0.012;
  o = vec4(col, 1.0);
}`;

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(s); document.title = 'ERR'; console.error(log); window.__err = log; throw new Error(log); } return s; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { window.__err = gl.getProgramInfoLog(pr); throw new Error(window.__err); }
gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(pr, n);

// --- scene ---
const v3 = { n: (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); }, x: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]] };
// planckish helpers in JS for the env uniforms (same as monoBB)
function bb(T) {
  if (T < 600) return [0, 0, 0];
  const lam = [0.61, 0.55, 0.465];
  const b = lam.map((l) => 1 / (l ** 5 * (Math.exp(14388 / (l * T)) - 1)));
  const x = T / 1811, s = (t) => { t = Math.min(Math.max((t - 640) / 220, 0), 1); return t * t * (3 - 2 * t); };
  return b.map((v) => (v / b[0]) * x ** 6 * s(T));
}
const view = P.get('view') || (innerWidth < innerHeight ? 'phone' : 'desk');
const sunMode = P.get('sun') || 'back';
const sunDir = v3.n(sunMode === 'back' ? [0.35, 0.07, -1] : sunMode === 'side' ? [1, 0.12, -0.3] : sunMode === 'shoulder' ? [0.85, 0.09, 0.55] : [0.3, 0.15, 1]);
const E = [1.6, 5.0, 0.42, 0.12];
const kinds = [0, 1, 1];
const narrow = view === 'phone';
const pos = narrow ? [[-0.2, 0, 0], [-4.6, 0, -9], [4.2, 0, -16]] : [[-5.6, 0, 0], [0, 0, -1.5], [5.6, 0, 0]];
const yaw = narrow ? [0.18, 0.35, -0.3] : [0.32, 0.0, -0.32];
const cams = {
  desk: { p: [0, 1.1, 17], at: [0, 4.4, 0], fov: 0.72 },
  phone: { p: [0.4, 1.0, 13.5], at: [-0.2, 5.0, -2], fov: 1.05 },
  // scale framings: low camera, further back, longer lens, horizon low in frame
  big: { p: [0, 0.35, 44], at: [0, 5.6, 0], fov: 0.36 },
  bigphone: { p: [0.6, 0.3, 30], at: [-0.5, 6.4, -4], fov: 0.62 },
  close: { p: [1.4, 3.2, 4.2], at: [-0.3, 5.8, 0], fov: 0.7 },
  low: { p: [0.6, 0.35, 9], at: [-0.2, 3.0, 0], fov: 0.9 },
};
const cam = cams[view] || cams.desk;
function lookAt(p, at) { const f = v3.n([at[0] - p[0], at[1] - p[1], at[2] - p[2]]); const r = v3.n(v3.x(f, [0, 1, 0])); const u = v3.x(r, f); return [...r, ...u, ...f.map((x) => -x)]; }

const tFixed = P.has('t') ? +P.get('t') : null;
const t0 = performance.now();
function frame() {
  const q = num('q', 1);
  const dpr = Math.min(devicePixelRatio || 1, 2) * q;
  const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  gl.viewport(0, 0, W, H);
  const T = tFixed ?? (performance.now() - t0) / 1000;
  gl.uniform2f(U('uRes'), W, H);
  gl.uniform3fv(U('uCamP'), cam.p); gl.uniformMatrix3fv(U('uCamM'), false, lookAt(cam.p, cam.at)); gl.uniform1f(U('uFov'), cam.fov);
  gl.uniform1f(U('uGrainT'), T);
  gl.uniform1f(U('uMonoT'), T);
  gl.uniform4fv(U('uMonoE'), E);
  gl.uniform4f(U('uMonoSun'), ...sunDir, 0.012);
  gl.uniform3fv(U('uMonoSunL'), [9000, 5200, 2600].map((x) => x * num('sunk', 1)));
  gl.uniform3fv(U('uMonoZen'), [0.004, 0.005, 0.009]);
  gl.uniform3fv(U('uMonoHorW'), [0.9, 0.32, 0.09].map((x) => x * num('hork', 1)));
  gl.uniform3fv(U('uMonoHorC'), [0.10, 0.14, 0.24]);
  const seaE = bb(980).map((x) => x * 14 * 0.96);
  gl.uniform3fv(U('uMonoSea'), seaE.map((x, k) => x + [0.9, 0.32, 0.09][k] * 0.06));
  gl.uniform3fv(U('uMonoPool'), bb(1320).map((x) => x * 14));
  const Pv = [], Mv = [], Kv = [];
  for (let i = 0; i < 3; i++) {
    const rise = num('rise' + i, num('rise', 1));
    Pv.push(...pos[i], rise > 0.001 ? 1 : 0);
    // hero angle (as lib/world/ventures.ts): turn the face so its normal sits just off the half vector between the
    // camera and the sun; the crown of the cast face then carries a vertical highlight band across it
    let a = yaw[i];
    if (P.has('aim')) {
      const vc = v3.n([cam.p[0] - pos[i][0], 0, cam.p[2] - pos[i][2]]);
      const hh = v3.n([vc[0] + sunDir[0], 0, vc[2] + sunDir[2]]);
      a = Math.atan2(hh[0], hh[2]) + [-0.075, 0.075, -0.11][i] * num('aim', 1);
    }
    const X = [Math.cos(a), 0, -Math.sin(a)], Y = [0, 1, 0], Z = v3.x(X, Y);
    Mv.push(...X, ...Y, ...Z);
    const ease = rise * rise * (3 - 2 * rise);
    const heat = P.has('hov') && +P.get('hov') === i ? num('heat', 1) : 0;
    Kv.push(-(1 - ease) * (2 * E[1] + 0.3) + heat * 0.25, heat, kinds[i], num('press', 0) * (heat > 0 ? 1 : 0));
  }
  gl.uniform4fv(U('uMonoP[0]'), Pv); gl.uniformMatrix3fv(U('uMonoM[0]'), false, Mv); gl.uniform4fv(U('uMonoK[0]'), Kv);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.__frames = (window.__frames || 0) + 1;
  if (tFixed === null) requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
</body>
</html>
