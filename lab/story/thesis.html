<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lab/story: thesis heat + type reflections</title>
<style>
  @font-face { font-family: Archivo; src: url(/app/fonts/Archivo-latin-wght400-800-wdth100-125.woff2) format('woff2'); font-weight: 400 800; font-stretch: 100% 125%; }
  :root { --bone: #e8e4d8; --ember: #ff5b1f; --quench: #8db6f2; --nav-h: 4rem; --font-display: Archivo, system-ui, sans-serif; }
  html { background: #000; } body { margin: 0; background: transparent; color: var(--bone); font-family: Archivo, system-ui, sans-serif; }
  p { margin: 0; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; display: block; }
  .container-x { max-width: 76rem; margin: 0 auto; padding: 0 16px; box-sizing: border-box; width: 100%; }
  @media (min-width: 640px) { .container-x { padding: 0 24px; } }
  @media (min-width: 1024px) { .container-x { padding: 0 32px; } }
  .wide { font-variation-settings: 'wdth' 125; }
  .label { font-size: 0.8125rem; font-weight: 500; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .js .wthesis-pin { position: fixed; inset: 0; }
  body.notext .wthesis-pin { visibility: hidden; }
</style>
<link rel="stylesheet" href="/components/world/Thesis.css">
</head>
<body class="js">
<canvas id="c"></canvas>
<section class="wthesis" id="th">
  <div class="wthesis-pin">
    <div class="wthesis-in container-x">
      <div class="wthesis-lines">
        <div class="wthesis-a"><p class="wthesis-h wide" data-reflect>Nothing new happens at 293&nbsp;K</p><p class="wthesis-s">293 K is room temperature.</p></div>
        <div class="wthesis-b"><p class="wthesis-h wide" data-reflect>An alloy is stronger than its metals</p><p class="wthesis-s">Steel is harder than iron. Bronze is harder than copper.</p></div>
      </div>
      <div class="wthesis-ro"><p class="label">Temperature</p><p class="wthesis-num wide"><span id="n">293</span> K</p><p class="label wthesis-cap" id="cap">Room temperature</p></div>
    </div>
  </div>
</section>
<script type="module">
import { THESIS_GLSL } from '/lib/world/thesis.ts';
import { TYPE_GLSL, typeAtlas, typeUpload } from '/lib/world/type.ts';
const qs = new URLSearchParams(location.search);
const K = +(qs.get('k') ?? 0), T0 = +(qs.get('t') ?? 3), Q = +(qs.get('q') ?? 1);
if (qs.has('notext')) document.body.classList.add('notext');
const th = document.getElementById('th');
th.style.setProperty('--k', K);
th.style.setProperty('--xa', qs.get('xa') ?? (K > 0.32 ? 1 : 0)); th.style.setProperty('--xb', qs.get('xb') ?? (K > 0.5 ? 1 : 0));
const tk = Math.round(293 + K * 1518);
document.getElementById('n').textContent = tk;
document.getElementById('cap').textContent = tk >= 1811 ? 'Iron melts' : tk <= 293 ? 'Room temperature' : 'Heating';
await document.fonts.ready;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
const dpr = Math.min(devicePixelRatio, 2) * Q;
cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
gl.viewport(0, 0, cv.width, cv.height);
// camera: low over the sea, pitched so the horizon sits at `hz` of the height from the top
const hz = +(qs.get('hz') ?? (innerWidth < 700 ? 0.66 : 0.62));
const fz = 1 / Math.tan((28 * Math.PI) / 180) * 0.5; // focal / viewport height
const pitch = Math.atan((hz - 0.5) / fz);
const fw = [0, Math.sin(pitch), Math.cos(pitch)], up = [0, Math.cos(pitch), -Math.sin(pitch)], rt = [1, 0, 0];

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes, uView; uniform float uT, uK, uFz, uTypeGain;
uniform vec3 uFw, uUp, uRt;
out vec4 o;
${THESIS_GLSL}
${TYPE_GLSL}
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
vec3 sky(vec3 d, float blur){
  vec3 c = vec3(0.0);
  vec2 sp = vec2(atan(d.z, d.x), asin(clamp(d.y,-1.,1.))) * 420.0;
  vec2 cell = floor(sp), f = fract(sp) - 0.5;
  float h = h21(cell);
  if (h > 0.985) { float m = smoothstep(0.5, 0.0, length(f - (vec2(h21(cell+3.1), h21(cell+7.7)) - 0.5)*0.6) * 1.6); c += m * mix(vec3(0.75,0.85,1.0), vec3(1.0,0.9,0.8), h21(cell+1.0)) * pow(h21(cell+9.0), 3.0) * 2.5 / (1.0 + blur * 8.0); }
  c += vec3(0.010, 0.012, 0.018) * exp(-abs(dot(d, normalize(vec3(0.3, 0.9, -0.3)))) * 6.0);
  c += vec3(0.05, 0.018, 0.006) * exp(-max(d.y, 0.0) * 60.0) * smoothstep(-0.02, 0.0, d.y);
  return c;
}
float swellH(vec2 p, float t){
  float h = 0.0;
  h += 0.060 * sin(dot(p, vec2(0.21, 0.98)) * 0.9 - t * 0.9);
  h += 0.035 * sin(dot(p, vec2(-0.45, 0.89)) * 1.6 - t * 1.2 + 1.3);
  h += 0.020 * sin(dot(p, vec2(0.78, 0.62)) * 2.9 - t * 1.7 + 2.1);
  h += 0.010 * sin(dot(p, vec2(-0.9, 0.42)) * 5.3 - t * 2.3 + 0.4);
  return h;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.0, 1.6, 0.0);
  vec3 rd = normalize(uv.x * uRt + uv.y * uUp + uFz * uFw);
  vec3 col;
  if (rd.y < -1e-4) {
    float d = ro.y / -rd.y; vec3 p = ro + rd * d;
    float fp = d / (uRes.y * uFz);
    float e = max(fp, 0.02);
    vec2 g = vec2(swellH(p.xz + vec2(e,0.), uT) - swellH(p.xz - vec2(e,0.), uT), swellH(p.xz + vec2(0.,e), uT) - swellH(p.xz - vec2(0.,e), uT)) / (2.0*e);
    float unres = fp * 6.0;
    g *= 1.0 / (1.0 + unres);
    vec3 nrm = normalize(vec3(-g.x, 1.0, -g.y));
    vec3 r = reflect(rd, nrm); r.y = abs(r.y);
    float cosv = clamp(dot(-rd, nrm), 0.0, 1.0);
    float F0 = mix(0.32, 0.04, smoothstep(0.15, 0.7, uK));
    float F = F0 + (1.0 - F0) * pow(1.0 - cosv, 5.0);
    col = sky(r, unres) * F;
    vec2 tp = typeProject(r, uRt, uUp, uFw, uFz * uView.y, uView);
    vec4 ty = typeAt(tp, clamp(log2(1.0 + d * 0.9), 0.0, 5.0));
    col += ty.rgb * uTypeGain * F;
    col += thesisEmission(p.xz, d, fp, uK, uT) * (1.0 - F);
  } else col = sky(rd, 0.0);
  col *= 1.6;
  col = aces(col);
  col = pow(col, vec3(1.0/2.2));
  col += (h21(gl_FragCoord.xy + fract(uT)*91.0) - 0.5) * 0.012;
  o = vec4(col, 1.0);
}`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(x)); } return x; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(pr));
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(pr, n);
gl.uniform2f(U('uRes'), cv.width, cv.height); gl.uniform2f(U('uView'), innerWidth, innerHeight);
gl.uniform1f(U('uT'), T0); gl.uniform1f(U('uK'), K); gl.uniform1f(U('uFz'), fz); gl.uniform1f(U('uTypeGain'), +(qs.get('tg') ?? 0.5));
gl.uniform3fv(U('uFw'), fw); gl.uniform3fv(U('uUp'), up); gl.uniform3fv(U('uRt'), rt);
const atlas = typeAtlas({ scale: 0.5 });
atlas.refresh();
typeUpload(gl, pr, {}, atlas.canvas, atlas.frame());
gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
