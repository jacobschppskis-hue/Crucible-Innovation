<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mark lab</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uT, uBeat, uDpr;
uniform vec3 uCam;      // camera position (world)
uniform vec2 uLook;     // yaw, pitch
uniform float uFov;     // vertical fov (rad)
uniform vec4 uMark;     // centre xyz (world), world units per mark unit
#define PI 3.14159265

float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
float vn3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
 mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}

// ---------------- the world stand-in (look/lava own the real ones) ----------------
const vec3 SUNC = vec3(1.0, 0.56, 0.26);
vec3 sunDir(vec3 ro){ return normalize(uMark.xyz - ro); }
vec3 skyCol(vec3 d, vec3 ro){
  float h = max(d.y, 0.);
  vec3 sd = sunDir(ro);
  vec2 dh = normalize(d.xz + vec2(0., 1e-4)), sh = normalize(sd.xz + vec2(0., 1e-4));
  float az = max(dot(dh, sh), 0.);
  vec3 c = vec3(0.30, 0.075, 0.022);
  c = mix(c, vec3(0.105, 0.035, 0.03), smoothstep(0.0, 0.035, h));
  c = mix(c, vec3(0.035, 0.026, 0.045), smoothstep(0.02, 0.09, h));
  c = mix(c, vec3(0.018, 0.034, 0.072), smoothstep(0.07, 0.2, h));
  c = mix(c, vec3(0.0045, 0.0065, 0.014), smoothstep(0.18, 0.45, h));
  c = mix(c, vec3(0.0012, 0.0013, 0.002), smoothstep(0.45, 0.9, h));
  c += vec3(0.95, 0.28, 0.06) * 0.30 * exp(-h * 22.) * pow(az, 6.);
  c += vec3(1.0, 0.40, 0.14) * 0.06 * exp(-h * 6.) * pow(az, 20.);
  return c;
}
// what the metal sees below: the lava sea's own glow (deep red) plus its reflection of the dusk
vec3 seaGlow(vec3 d){ return vec3(0.16, 0.030, 0.006) * (0.6 + 0.4 * smoothstep(-0.05, -0.6, d.y)); }
vec3 envCol(vec3 d, vec3 ro){ return d.y >= 0. ? skyCol(d, ro) : mix(seaGlow(d), skyCol(vec3(d.x, -d.y, d.z), ro) * 0.25, 0.5); }

// ---------------- MARK: Jacob's Split Ring, extruded (lib/splitRing.ts, 64-unit box, y up, core at 0) ----------------
const float RO_ = 26.6667, RI_ = 16.0, HS = 1.73333, HP = 2.13333, RC = 4.8, HD = 1.2, BEV = 0.5;
// 2D distance to the left half-annulus of radius r (flat end faces on x = 0)
float sdArcL(vec2 p, float r){
  if (p.x < 0.) return abs(length(p) - r) - HS;
  float ey = abs(abs(p.y) - r) - HS;
  return length(max(vec2(p.x, ey), 0.)) + min(max(p.x, ey), 0.);
}
float sdBox2(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
// the squares: centre angle th measured from the top (0) down the right side (pi)
vec2 cellC(int i, out float th){
  int ring = i < 7 ? 0 : 1; int k = ring == 0 ? i + 1 : i - 6; float n = ring == 0 ? 7. : 4.;
  th = float(k) * PI / (n + 1.); float r = ring == 0 ? RO_ : RI_;
  return vec2(sin(th), cos(th)) * r;
}
// 2D: distance, piece id (0 outer arc, 1 inner arc, 2..12 squares)
vec2 sd2(vec2 p){
  vec2 b = vec2(sdArcL(p, RO_), 0.);
  float a1 = sdArcL(p, RI_); if (a1 < b.x) b = vec2(a1, 1.);
  // squares live only on the right (x > 0): skip them on the left
  if (p.x > -HP - 1.) {
    float th;
    for (int i = 0; i < 11; i++){ vec2 c = cellC(i, th); float d = sdBox2(p - c, vec2(HP)); if (d < b.x) b = vec2(d, float(i + 2)); }
  }
  return b;
}
// 3D rounded extrusion, depth 2*HD, bevel BEV
vec2 sdMark(vec3 p){
  vec2 b = sd2(p.xy);
  vec2 w = vec2(b.x + BEV, abs(p.z) - HD + BEV);
  return vec2(min(max(w.x, w.y), 0.) + length(max(w, 0.)) - BEV, b.y);
}
vec3 markN(vec3 p, float e){
  const vec2 k = vec2(1, -1);
  return normalize(k.xyy * sdMark(p + k.xyy * e).x + k.yyx * sdMark(p + k.yyx * e).x + k.yxy * sdMark(p + k.yxy * e).x + k.xxx * sdMark(p + k.xxx * e).x);
}
// soft shadow toward the core (a sphere light of radius RC at the origin), pieces only
float coreShadow(vec3 p, vec3 n){
  vec3 L = -p; float dl = length(L); vec3 l = L / dl;
  float sa = RC / dl;                               // sine of the core's angular radius
  float res = 1., t = 0.15;
  vec3 o = p + n * 0.06;
  for (int i = 0; i < 28; i++){
    float h = sdMark(o + l * t).x;
    res = min(res, h / (sa * t));
    t += clamp(h, 0.08, 1.6);
    if (res < -1. || t > dl - RC) break;
  }
  res = clamp(res, -1., 1.);
  return 0.25 * (1. + res) * (1. + res) * (2. - res);
}
// The heat of the beat: one front leaves the top (where the arcs end and the squares begin, after the empty step) and
// runs down both halves at the same angle: continuous along the arcs, a whole square at a time on the machine half.
// Returns temperature 0..1 (1 = white-hot edge).
float frontTheta(float b){ float x = clamp((b - 0.12) / 0.58, 0., 1.); return PI * mix(x, x * x * (3. - 2. * x), 0.35); }
float heatAt(vec2 p, float id){
  float b = uBeat;
  if (b <= 0.11 || b >= 1.) return 0.;
  float tf = frontTheta(b);
  float th, x;
  if (id < 1.5) { th = clamp(atan(-p.x, p.y), 0., PI); x = tf - th; }      // arcs: angle from the top, down the left
  else {                                                                    // squares: whole, from their centre out
    vec2 c = cellC(int(id) - 2, th);
    x = tf - th - 0.05 * length(p - c) / HP;
  }
  // a crisp white-hot edge, then a trail that settles to a low red glow: each half alone only smoulders
  float on = id < 1.5 ? smoothstep(-0.012, 0.004, x) : smoothstep(0.0, 0.02, x);
  float T = on * (0.22 + 0.78 * exp(-max(x, 0.) / 0.09));
  // the meeting: both fronts reach the bottom together and the whole ring blazes at once, brightest where they met
  float close = smoothstep(0.69, 0.73, b) * (1. - smoothstep(0.73, 0.80, b) * 0.35);
  float thc = clamp(atan(-abs(p.x), p.y), 0., PI);
  T = max(T, close * (0.47 + 0.30 * exp(-(PI - (id < 1.5 ? th : thc)) / 0.35) * (1. - smoothstep(0.72, 0.80, b))));
  // then it cools, top first, both halves together (one material now): orange, red, dark
  float c = smoothstep(0.76 + 0.10 * (th / PI), 0.92 + 0.08 * (th / PI), b);
  return clamp(T * (1. - c), 0., 1.);
}
// incandescence: the colour of a blackbody (Planck at three wavelengths) from 800 K (T 0) to 3200 K (T 1); brightness
// on a perceptual curve (real radiance spans 10^5 over this range; the eye adapts, the film does too)
vec3 glowRamp(float T){
  if (T <= 0.001) return vec3(0.);
  float K = 800. + 2400. * T;
  vec3 lam = vec3(610., 549., 468.);
  vec3 bb = 1. / (pow(lam / 610., vec3(5.)) * (exp(1.4388e7 / (lam * K)) - 1.));
  bb /= bb.r;
  return bb * 4.5 * pow(T, 2.8);
}
float flare(){ float b = uBeat; return smoothstep(0.64, 0.73, b) * (1. - smoothstep(0.76, 0.95, b)); }

// GGX
float Dggx(float nh, float a){ float a2 = a * a; float d = nh * nh * (a2 - 1.) + 1.; return a2 / (PI * d * d); }
float Vsmith(float nv, float nl, float a){ float k = a * 0.5; return 0.25 / ((nv * (1. - k) + k) * (nl * (1. - k) + k)); }

vec3 coreRadiance(){ return vec3(9.0, 4.6, 1.9) * (1. + 1.2 * flare()); }

// shade a hit on the metal; p local (mark units), rdL local ray dir, roW world origin
vec3 shadeMetal(vec3 p, vec3 rdL, float id, float px, vec3 roW){
  vec3 n = markN(p, max(px * 0.5, 0.01));
  vec3 v = -rdL;
  // fine cast-sand grain as a normal perturbation that fades out before the pixel size (kept as roughness)
  float gf = 5.0, fade = 1. - smoothstep(0.25, 0.7, px * gf);
  vec3 q = p * gf + id * 7.31;
  float g0 = vn3(q);
  vec3 gg = vec3(vn3(q + vec3(.05, 0, 0)) - g0, vn3(q + vec3(0, .05, 0)) - g0, vn3(q + vec3(0, 0, .05)) - g0) / .05;
  gg -= dot(gg, n) * n;
  n = normalize(n - gg * 0.035 * fade);
  float rough = 0.34 + 0.12 * (1. - fade) + 0.06 * (g0 - 0.5);
  float a = rough * rough;
  vec3 F0 = vec3(0.80, 0.76, 0.68) * (0.96 + 0.08 * hash12(vec2(id, 3.1)));
  float nv = max(dot(n, v), 1e-3);
  vec3 col = vec3(0.);
  // 1. the core: a sphere light at the origin (representative point for the specular)
  vec3 L = -p; float dl = length(L); vec3 l = L / dl;
  float sh = coreShadow(p, n);
  vec3 Lc = coreRadiance();
  float sa2 = (RC * RC) / (dl * dl);
  float nl = clamp(dot(n, l), 0., 1.);
  // the core is big next to the pieces: soften the terminator by its angular size
  float nlS = clamp((dot(n, l) + sqrt(sa2) * 0.6) / (1. + sqrt(sa2) * 0.6), 0., 1.);
  vec3 r = reflect(-v, n);
  vec3 cr = dot(L, r) * r - L; vec3 cp = L + cr * clamp(RC / max(length(cr), 1e-4), 0., 1.); vec3 ls = normalize(cp);
  vec3 hv = normalize(ls + v);
  float nls = max(dot(n, ls), 0.);
  float aS = clamp(a + 0.5 * RC / dl, 0., 1.);
  float norm = (a * a) / (aS * aS);
  vec3 F = F0 + (1. - F0) * pow(1. - max(dot(hv, v), 0.), 5.);
  vec3 spec = F * Dggx(max(dot(n, hv), 0.), aS) * Vsmith(nv, nls, a) * nls * norm;
  vec3 diff = (1. - F) * 0.04 / PI * nlS;  // metal: almost no diffuse (a thin oxide skin)
  col += Lc * PI * sa2 * (spec + diff) * sh;
  // 2. the dusk and the sea: the metal mirrors what is around it (roughness-blurred by two taps)
  vec3 rW = normalize(vec3(r.x, r.y, -r.z));
  vec3 e1 = envCol(rW, roW), e2 = envCol(normalize(rW + vec3(0., 0.35, 0.)), roW) * 0.5 + envCol(normalize(rW - vec3(0., 0.35, 0.)), roW) * 0.5;
  vec3 Fe = F0 + (1. - F0) * pow(1. - nv, 5.) * 0.8;
  float T = heatAt(p.xy, id);
  // hot metal: its own light swamps what it mirrors (no cool sky on a glowing face: that read pink)
  col *= 1. - 0.5 * smoothstep(0.08, 0.5, T);
  col += Fe * mix(e1, e2, smoothstep(0.1, 0.5, a)) * (1. - 0.6 * smoothstep(0.08, 0.5, T));
  // 3. heat of the beat: incandescence
  // the edge of a heated piece glows a bit cooler (it loses heat first); the faces are the hottest
  // edges and corners lose heat first: the faces hold it, the bevels and walls run a little cooler
  float faceT = T * (0.80 + 0.20 * smoothstep(0.3, 0.95, abs(n.z)));
  if (id > 1.5) { vec2 c; float th2; c = cellC(int(id) - 2, th2); vec2 dq = abs(p.xy - c) / HP; faceT *= 1. - 0.12 * smoothstep(0.55, 1.0, max(dq.x, dq.y)); }
  else { float dr = abs(length(p.xy) - (id < 0.5 ? RO_ : RI_)) / HS; faceT *= 1. - 0.10 * smoothstep(0.5, 1.0, dr) - 0.06 * dr * dr; }
  col += glowRamp(faceT);
  return col;
}

// ray vs the mark's slab box (local)
bool boxHit(vec3 ro, vec3 rd, vec3 b, out float t0, out float t1){
  vec3 inv = 1. / rd; vec3 a = (-b - ro) * inv, c = (b - ro) * inv;
  vec3 mn = min(a, c), mx = max(a, c);
  t0 = max(max(mn.x, mn.y), mn.z); t1 = min(min(mx.x, mx.y), mx.z);
  return t1 > max(t0, 0.);
}
// returns rgb + coverage; rays in world space; pixel angle pa (rad per px)
vec4 traceMark(vec3 roW, vec3 rdW, float pa, out float tHit){
  tHit = 1e9;
  float S = uMark.w;
  vec3 ro = (roW - uMark.xyz) / S; ro.z = -ro.z;
  vec3 rd = vec3(rdW.x, rdW.y, -rdW.z);
  vec4 res = vec4(0.);
  // the core: a sphere emitter
  float bq = dot(ro, rd), cq = dot(ro, ro) - RC * RC, hq = bq * bq - cq;
  float tc = 1e9;
  if (hq > 0.) { tc = -bq - sqrt(hq); }
  float t0, t1;
  float best = 1e9, bestT = 0.;
  if (boxHit(ro, rd, vec3(31.5, 31.5, HD + 0.01), t0, t1)) {
    float t = max(t0, 0.);
    for (int i = 0; i < 64; i++) {
      vec3 p = ro + rd * t;
      vec2 d = sdMark(p);
      float pw = t * pa;                              // pixel footprint in mark units
      if (d.x < best) { best = d.x; bestT = t; }
      if (d.x < pw * 0.25) {
        if (t < tc) {
          vec3 c = shadeMetal(p, rd, d.y, pw, roW);
          tHit = t * S;
          return vec4(c, 1.);
        }
        break;
      }
      t += d.x;
      if (t > t1) break;
    }
  }
  if (tc < 1e8 && tc > 0.) {
    vec3 p = ro + rd * tc; vec3 n = normalize(p);
    float mu = max(dot(n, -rd), 0.);
    // limb darkening, a yellow-white heart under an orange skin, a slow faint boil (large cells only)
    float boil = vn3(n * 3.0 + vec3(0., 0., uT * 0.05)) * 0.6 + vn3(n * 7.0 - vec3(uT * 0.08)) * 0.4;
    vec3 heart = vec3(6.5, 3.9, 1.8), skin = vec3(3.4, 0.95, 0.20), limb = vec3(1.1, 0.17, 0.025);
    vec3 c = mix(limb, skin, smoothstep(0.0, 0.45, mu));
    c = mix(c, heart, smoothstep(0.72, 1.0, mu) * (0.8 + 0.4 * boil));
    c *= 0.9 + 0.2 * boil;
    c *= 1. + 1.3 * flare();
    tHit = tc * S;
    return vec4(c, 1.);
  }
  // anti-aliased silhouette: coverage from the closest approach
  float pw = bestT * pa;
  float cov = clamp(0.5 - best / max(pw, 1e-4), 0., 1.);
  if (cov > 0. && best < 1e8) {
    vec3 p = ro + rd * bestT;
    vec2 d = sdMark(p);
    return vec4(shadeMetal(p, rd, d.y, pw, roW), cov);
  }
  return vec4(0.);
}

// glare of the sun (a lens effect, over everything): angular distance to the core
vec3 glare(vec3 roW, vec3 rdW){
  vec3 sd = normalize(uMark.xyz - roW);
  float cs = max(dot(rdW, sd), 0.);
  float ang = acos(min(cs, 1.));
  float rad = RC * uMark.w / length(uMark.xyz - roW);
  float x = ang / rad;
  return SUNC * (0.10 * exp(-x * 0.9) + 0.035 * exp(-x * 0.22) + 0.012 * exp(-x * 0.05)) * (1. + 1.4 * flare());
}

// sea stand-in: a calm molten swell, glossy, glowing faintly
float swellH(vec2 p){
  return 1.6 * sin(dot(p, vec2(0.012, 0.009)) + uT * 0.55) + 1.1 * sin(dot(p, vec2(-0.007, 0.016)) + uT * 0.42) + 0.5 * sin(dot(p, vec2(0.031, 0.02)) + uT * 0.9);
}
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0., 1.); }

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (frag - 0.5 * uRes) / uRes.y;
  float th = tan(uFov * 0.5);
  float cy = cos(uLook.x), sy = sin(uLook.x), cp = cos(uLook.y), sp = sin(uLook.y);
  vec3 fw = vec3(sy * cp, sp, cy * cp), rt = normalize(vec3(cy, 0., -sy)), up = cross(fw, rt);
  vec3 rd = normalize(fw + (uv.x * rt + uv.y * up) * 2. * th);
  vec3 ro = uCam;
  float pa = 2. * th / uRes.y;
  vec3 col;
  float tM;
  vec4 m = traceMark(ro, rd, pa, tM);
  if (rd.y < 0.) {
    float t = -ro.y / rd.y;
    vec3 P = ro + rd * t;
    float e = 1.0 + t * pa * 2.;
    vec2 gH = vec2(swellH(P.xz + vec2(e, 0)) - swellH(P.xz - vec2(e, 0)), swellH(P.xz + vec2(0, e)) - swellH(P.xz - vec2(0, e))) / (2. * e);
    float fp = t * pa;                               // footprint: far swell flattens, its slope becomes roughness
    float keep = 1. / (1. + fp * 0.02);
    vec3 n = normalize(vec3(-gH.x * keep, 1., -gH.y * keep));
    vec3 r = reflect(rd, n);
    float F = 0.04 + 0.96 * pow(1. - max(dot(n, -rd), 0.), 5.);
    vec3 refl = skyCol(r, P);
    float tR; vec4 mr = traceMark(P + n * 0.1, r, pa * (1. + 0.0), tR);
    refl = mix(refl, mr.rgb, mr.a);
    col = refl * F * 1.0 + vec3(0.06, 0.010, 0.002) * (1. - F);
    // the core's glitter column: a GGX lobe widened by the unresolved slope
    vec3 L = normalize(uMark.xyz - P);
    vec3 hv = normalize(L - rd);
    float aR = 0.06 + fp * 0.0004;
    col += SUNC * 6.0 * Dggx(max(dot(n, hv), 0.), aR) * F * 0.02 * max(L.y, 0.) * (1. + flare());
    if (m.a > 0. && tM < t) col = mix(col, m.rgb, m.a);
  } else {
    col = skyCol(rd, ro);
    // stars, sparse, cold, sized to a pixel
    vec2 g = vec2(atan(rd.x, rd.z), asin(rd.y)) / pa * 0.25;
    vec2 cell = floor(g), f = fract(g) - 0.5; float hs = hash12(cell);
    if (hs > 0.992 && rd.y > 0.15) { vec2 o = vec2(hash12(cell + 7.1), hash12(cell + 3.3)) - 0.5; float r2 = dot(f - o * 0.5, f - o * 0.5) * 16.; col += vec3(0.6, 0.75, 1.0) * exp(-r2 * 6.) * (hs - 0.992) * 60. * smoothstep(0.15, 0.4, rd.y); }
    col = mix(col, m.rgb, m.a);
  }
  col += glare(ro, rd);
  col = aces(col * 0.85);
  col = pow(col, vec3(1. / 2.2));
  col += (hash12(frag + fract(uT * 7.13) * 91.) - 0.5) / 160.;
  fragColor = vec4(col, 1.);
}
</script>
<script>
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const dpr = +(Q.get('dpr') || Math.min(devicePixelRatio, 2));
function resize() { cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
resize();
const vs = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { document.title = 'ERR ' + gl.getShaderInfoLog(o); throw new Error(gl.getShaderInfoLog(o)); } return o; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent.trim()));
gl.linkProgram(pr); gl.useProgram(pr);
const U = (n) => gl.getUniformLocation(pr, n);
const portrait = innerHeight > innerWidth;
// scene: camera low over the sea, the mark (outer radius ~31 mark units) far away, lowest square clear of the horizon
const S = +(Q.get('S') || 40), D = +(Q.get('D') || 6000);
const cam = [0, +(Q.get('h') || 60), 0];
const fov = (portrait ? 64 : 38) * Math.PI / 180 * +(Q.get('fz') || 1);
const markC = [0, +(Q.get('mh') || (portrait ? 1700 : 1650)), D];
const pitch = +(Q.get('pitch') || (portrait ? 0.17 : 0.16));
window.render = function (beat, t) {
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U('uRes'), cv.width, cv.height);
  gl.uniform1f(U('uT'), t); gl.uniform1f(U('uBeat'), beat); gl.uniform1f(U('uDpr'), dpr);
  gl.uniform3f(U('uCam'), ...cam); gl.uniform2f(U('uLook'), 0, pitch); gl.uniform1f(U('uFov'), fov);
  gl.uniform4f(U('uMark'), ...markC, S);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
};
render(+(Q.get('b') || 0), +(Q.get('t') || 3));
document.title = 'ok';
</script></body></html>
