# Checks every pull request before it can reach the live site.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lighthouse (performance is a warning; accessibility, SEO and best practices must pass)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          if-no-files-found: ignore
